name: Check GitHub Test.iflw (Groovy script only)

on:
  push:
    paths:
      - "GitHub_Test/src/main/resources/scenarioflows/integrationflow/GitHub Test.iflw"

jobs:
  check-github-test-groovy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GitHub Test.iflw exists
        run: |
          set -e
          FILE_PATH_IFLW="GitHub_Test/src/main/resources/scenarioflows/integrationflow/GitHub Test.iflw"

          if [ ! -f "$FILE_PATH_IFLW" ]; then
            echo "File not found: $FILE_PATH_IFLW"
            exit 1
          fi

          echo "Found: $FILE_PATH_IFLW"

      - name: Check Groovy script exists
        run: |
          set -e

          GROOVY_ROOT="GitHub_Test/src/main/resources/script"

          echo "Searching for Groovy scripts under: $GROOVY_ROOT"

          if [ ! -d "$GROOVY_ROOT" ]; then
            echo "Groovy script directory not found: $GROOVY_ROOT"
            exit 1
          fi

          GROOVY_FILES=$(find "$GROOVY_ROOT" -iname "*.groovy" || true)

          if [ -z "$GROOVY_FILES" ]; then
            echo "No Groovy script (.groovy) found in $GROOVY_ROOT."
            exit 1
          fi

          echo "Found Groovy script(s):"
          echo "$GROOVY_FILES"
          echo "Groovy script check passed."
